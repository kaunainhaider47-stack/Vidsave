<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VidSave - Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h2>VidSave</h2>
  </header>

  <main>
    <h1>Download Videos</h1>
    <p>Paste a video URL below</p>

    <div class="box">
      <input type="url" placeholder="Paste video link here">
      <button>Download</button>
    </div>

    <p class="note">
      Download content you own or have permission to download.
    </p>
  </main>

  <footer>
    © 2026 VidSave
  </footer>
</body>
</html>
